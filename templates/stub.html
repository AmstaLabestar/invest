{% extends 'base.html' %}
{% block title %}{{ title }} - InvestPlatform{% endblock %}

{% block content %}
<div class="mb-6 flex" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 65vh; text-align: center;">
    <i class="ph-duotone ph-cone text-yellow-500" style="font-size: 6rem; margin-bottom: 2rem; opacity: 0.9; color: #eab308;"></i>
    <h2 class="text-xl font-bold text-white mb-3" style="font-size: 1.5rem;">{{ title }}</h2>
    <p class="text-gray-400 text-sm mb-8" style="max-width: 85%; line-height: 1.6;">
        Cette section est actuellement en cours de développement. Elle sera très bientôt disponible pour votre compte !
    </p>
    <a href="{% url 'profile' %}" class="btn" style="background-color: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.1); width: auto; padding: 0.8rem 2rem; border-radius: 999px;">
        ← Retour au Profil
    </a>
</div>
{% endblock %}
