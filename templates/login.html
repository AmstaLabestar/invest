{% load static %}
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion - InvestPlatform</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}?v=prod_ui_v1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.min.css">
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('theme-light');
            window.addEventListener('DOMContentLoaded', () => { document.body.classList.add('theme-light'); });
        }
    </script>
</head>
<body class="auth-page">
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="ph-bold ph-lock-key"></i>
                </div>
                <div class="hero-eyebrow">Connexion securisee</div>
                <h1 class="auth-title">Accédez à votre espace.</h1>
                <p class="auth-copy">Suivez vos souscriptions, gains, retraits et parrainages.</p>
            </div>

            <form method="POST" action="{% url 'login' %}" class="form-stack">
                {% csrf_token %}

                {% if error %}
                <div class="alert-box error">{{ error }}</div>
                {% endif %}

                <label class="field">
                    <span class="field-label">Identifiant</span>
                    <input type="text" name="username" required placeholder="Pseudo, telephone ou email" class="field-control">
                </label>

                <label class="field">
                    <span class="field-label">Mot de passe</span>
                    <input type="password" name="password" required placeholder="Entrez votre mot de passe" class="field-control">
                </label>

                <button type="submit" class="btn btn-primary">
                    <i class="ph-bold ph-arrow-right"></i>
                    Se connecter
                </button>
            </form>

            <div class="auth-footer">
                Nouveau sur InvestPlatform ?
                <a href="{% url 'register' %}" class="auth-link">Creer un compte</a>
                <br>
                <a href="{% url 'home' %}" class="auth-link">Retour a l'accueil</a>
            </div>
        </section>
    </main>
</body>
</html>
