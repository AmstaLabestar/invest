{% extends 'base.html' %}
{% block title %}Mes informations - InvestPlatform{% endblock %}

{% block content %}
<div class="page-stack">
    <div class="page-topbar">
        <a href="{% url 'profile' %}" class="icon-button" aria-label="Retour">
            <i class="ph-bold ph-arrow-left"></i>
        </a>
        <h1>Mes informations</h1>
        <span></span>
    </div>

    <form method="POST" action="{% url 'settings_info' %}" class="card card-dark form-stack">
        {% csrf_token %}

        <div class="section-heading">
            <div>
                <div class="section-label">
                    <i class="ph-duotone ph-identification-card"></i>
                    Identite
                </div>
                <h2>Informations du compte</h2>
            </div>
        </div>

        <div class="form-grid">
            <label class="field">
                <span class="field-label">Prenom</span>
                <input type="text" name="first_name" value="{{ user.first_name }}" class="field-control" placeholder="Votre prenom">
            </label>

            <label class="field">
                <span class="field-label">Nom de famille</span>
                <input type="text" name="last_name" value="{{ user.last_name }}" class="field-control" placeholder="Votre nom">
            </label>
        </div>

        <label class="field">
            <span class="field-label">Adresse email</span>
            <input type="email" name="email" value="{{ user.email }}" class="field-control" placeholder="contact@investplatform.com">
        </label>

        <label class="field">
            <span class="field-label">Numero Mobile Money</span>
            <input type="text" name="phone_number" value="{{ user.phone_number|default:'' }}" class="field-control" readonly>
            <span class="help-text">Ce numero est verrouille car il sert aux retraits et a la securite operationnelle.</span>
        </label>

        <button type="submit" class="btn btn-primary">
            <i class="ph-bold ph-check"></i>
            Sauvegarder
        </button>
    </form>
</div>
{% endblock %}
