{% extends 'base.html' %}
{% block title %}Mot de passe - NOVARIS{% endblock %}

{% block content %}
<div class="page-stack">
    <div class="page-topbar">
        <a href="{% url 'profile' %}" class="icon-button" aria-label="Retour">
            <i class="ph-bold ph-arrow-left"></i>
        </a>
        <h1>Mot de passe</h1>
        <span></span>
    </div>

    <section class="card card-dark">
        <div class="section-heading mb-4">
            <div>
                <div class="section-label">
                    <i class="ph-duotone ph-lock-key"></i>
                    Securite
                </div>
                <h2>Changer le mot de passe</h2>
            </div>
            <span class="status-pill warning">Prive</span>
        </div>

        <form method="POST" action="{% url 'settings_password' %}" class="form-stack">
            {% csrf_token %}

            {% for field in form %}
            <label class="field">
                <span class="field-label">{{ field.label }}</span>
                {{ field.errors }}
                <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" class="field-control" placeholder="********" required>
                {% if field.help_text %}
                <span class="help-text">{{ field.help_text|safe }}</span>
                {% endif %}
            </label>
            {% endfor %}

            <button type="submit" class="btn btn-warning">
                <i class="ph-bold ph-shield-check"></i>
                Mettre a jour
            </button>
        </form>
    </section>
</div>
{% endblock %}
