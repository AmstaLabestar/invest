{% extends 'base.html' %}
{% block title %}Theme - InvestPlatform{% endblock %}

{% block content %}
<div class="page-stack">
    <div class="page-topbar">
        <a href="{% url 'profile' %}" class="icon-button" aria-label="Retour">
            <i class="ph-bold ph-arrow-left"></i>
        </a>
        <h1>Theme</h1>
        <span></span>
    </div>

    <section class="card card-dark">
        <div class="section-heading mb-4">
            <div>
                <div class="section-label">
                    <i class="ph-duotone ph-palette"></i>
                    Apparence
                </div>
                <h2>Choisir un mode</h2>
            </div>
        </div>

        <div class="menu-list">
            <article id="btn-theme-dark" onclick="setTheme('dark')" class="menu-item theme-option active">
                <span class="menu-item-main">
                    <span class="theme-preview dark"><span></span></span>
                    <span class="menu-item-copy">
                        <span class="menu-item-title">Mode sombre</span>
                        <span class="menu-item-subtitle">Fond sombre</span>
                    </span>
                </span>
                <span id="badge-dark" class="status-pill success">Actif</span>
            </article>

            <article id="btn-theme-light" onclick="setTheme('light')" class="menu-item theme-option">
                <span class="menu-item-main">
                    <span class="theme-preview light"><span></span></span>
                    <span class="menu-item-copy">
                        <span class="menu-item-title">Mode clair</span>
                        <span class="menu-item-subtitle">Fond clair</span>
                    </span>
                </span>
                <span id="badge-light" class="status-pill info" style="display:none;">Actif</span>
            </article>
        </div>
    </section>
</div>

<script>
function updateThemeUI() {
    const currentTheme = localStorage.getItem('theme') || 'dark';
    const darkBtn = document.getElementById('btn-theme-dark');
    const lightBtn = document.getElementById('btn-theme-light');
    const darkBadge = document.getElementById('badge-dark');
    const lightBadge = document.getElementById('badge-light');

    if (currentTheme === 'light') {
        lightBtn.classList.add('active');
        darkBtn.classList.remove('active');
        lightBadge.style.display = 'inline-flex';
        darkBadge.style.display = 'none';
    } else {
        darkBtn.classList.add('active');
        lightBtn.classList.remove('active');
        darkBadge.style.display = 'inline-flex';
        lightBadge.style.display = 'none';
    }
}

function setTheme(themeName) {
    localStorage.setItem('theme', themeName);
    if (themeName === 'light') {
        document.body.classList.add('theme-light');
        document.documentElement.classList.add('theme-light');
    } else {
        document.body.classList.remove('theme-light');
        document.documentElement.classList.remove('theme-light');
    }
    updateThemeUI();
}

document.addEventListener('DOMContentLoaded', updateThemeUI);
</script>
{% endblock %}
