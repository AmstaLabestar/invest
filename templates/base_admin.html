{% load static %}
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Administration{% endblock %}</title>
    
    <!-- Premium Design System CSS -->
    <link rel="stylesheet" href="{% static 'css/index.css' %}?v=admin">
    
    {% include 'includes/icon_assets.html' %}
</head>
<body>
    
    <header class="top-header" style="background-color: var(--bg-dark);">
        <div class="flex-row">
            <i class="ph-fill ph-shield-check text-2xl text-accent"></i>
            <span class="header-title">{% block top_title %}NOVARIS Admin{% endblock %}</span>
        </div>
        <div class="flex-row" style="gap: 1rem;">
            <a href="/" class="btn-icon" title="Retour Accueil">
                <i class="ph ph-house"></i>
            </a>
            <a href="{% url 'logout' %}" class="btn-icon" style="color: #ef4444; background: rgba(239, 68, 68, 0.1);">
                <i class="ph ph-sign-out"></i>
            </a>
        </div>
    </header>

    <main class="mt-4" style="padding-bottom: 30px; width: 100%;">
        {% block content %}
        {% endblock %}
    </main>
    
</body>
</html>
